name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Build HandheldHero
        run: pyinstaller --onefile --windowed --clean --noconfirm --name HandheldHero handheld_hero.py

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HandheldHero-Windows
          path: dist/HandheldHero.exe
          retention-days: 3
